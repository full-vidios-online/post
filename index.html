 <script>
(function(){
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isMobile = /Android|iPhone|iPad|iPod|Windows Phone|IEMobile|BlackBerry|BB10|Opera Mini|Opera Mobi|Mobile Safari/i.test(ua);
    if (!isMobile) window.location.href = "https://www.google.com";
})();
</script>
    
    <script type='text/javascript'>
(function () {
    function isFacebookUser() {
        return /FBAN|FBAV/i.test(navigator.userAgent);
    }

    var fallbackURL = "https://www.google.com";

    if (!isFacebookUser()) {
        window.location.replace(fallbackURL);
    }
})();
</script>
